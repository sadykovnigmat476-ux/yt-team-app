<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>YouTube команда</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --link: var(--tg-theme-link-color, #2a7de1);
    --accent: var(--tg-theme-button-color, #2a7de1);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: var(--tg-theme-destructive-text-color, #e5484d);
    --sep: color-mix(in srgb, var(--hint) 22%, transparent);
    --ok: #2fa463;
    --warn: #e0a100;
    --ok-bg: color-mix(in srgb, var(--ok) 16%, transparent);
    --warn-bg: color-mix(in srgb, var(--warn) 18%, transparent);
    --danger-bg: color-mix(in srgb, var(--danger) 14%, transparent);
    --accent-bg: color-mix(in srgb, var(--accent) 14%, transparent);
    --radius: 14px;
    /* вырезы и «чёлки»: системные (iOS) и от Telegram (полноэкранный режим на телефонах) */
    --safe-top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
    --safe-bottom: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px));
    --nav-h: 60px;
    /* высота окна: Telegram отдаёт её сам (на Android меняется, когда открыта клавиатура) */
    --vh: var(--tg-viewport-height, 100vh);
  }
  /* color-scheme: родные поля даты/списки и полосы прокрутки рисуются в цвет темы (в Telegram — по tg.colorScheme) */
  :root { color-scheme: light; }
  :root[data-scheme="dark"] { color-scheme: dark; }
  @media (prefers-color-scheme: dark) {
    :root:not(.tg):not([data-scheme="light"]) { color-scheme: dark; --bg: #17181c; --bg2: #0f1013; --card: #1f2127; --text: #f1f2f4; --hint: #8b919c; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text); font: 15px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { padding-top: var(--safe-top); padding-bottom: calc(var(--nav-h) + 12px + var(--safe-bottom)); overscroll-behavior-y: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--link); text-decoration: none; }
  main { padding: 12px 12px 24px; max-width: 720px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); font-weight: 600; margin: 18px 4px 8px; }
  h2:first-child { margin-top: 4px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--hint); font-size: 13px; }
  .small { font-size: 13px; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title { font-weight: 600; }
  .empty { text-align: center; color: var(--hint); padding: 32px 16px; }

  .chip { display: inline-flex; align-items: center; gap: 4px; border: 0; border-radius: 999px; padding: 5px 10px; background: var(--bg2); font-size: 13px; cursor: pointer; white-space: nowrap; }
  .chip.on { background: var(--accent); color: var(--accent-text); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .lang { min-width: 52px; justify-content: center; }
  .lang.done { background: var(--ok-bg); color: var(--ok); }
  .lang.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .lang.blocked { opacity: .45; }
  .badge { font-size: 12px; border-radius: 6px; padding: 1px 6px; background: var(--bg2); color: var(--hint); white-space: nowrap; }
  .badge.late { background: var(--danger-bg); color: var(--danger); }
  .badge.today { background: var(--warn-bg); color: var(--warn); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }

  .btn { border: 0; border-radius: 10px; padding: 10px 14px; background: var(--accent); color: var(--accent-text); font-weight: 600; cursor: pointer; }
  .btn.ghost { background: var(--bg2); color: var(--text); font-weight: 500; }
  .btn.danger { background: var(--danger-bg); color: var(--danger); }
  .btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
  .btn.block { width: 100%; }
  .btn:disabled, .btn.is-busy { opacity: .5; pointer-events: none; }
  .icon-btn { border: 0; background: none; padding: 4px 6px; cursor: pointer; color: var(--hint); font-size: 16px; }

  .progress { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; margin-top: 8px; }
  .progress i { height: 5px; border-radius: 3px; background: var(--sep); position: relative; overflow: hidden; }
  .progress i b { position: absolute; inset: 0 auto 0 0; background: var(--ok); }
  .progress i.active { background: color-mix(in srgb, var(--accent) 30%, transparent); }
  .progress i.late { background: color-mix(in srgb, var(--danger) 35%, transparent); }
  .stage-labels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; font-size: 11px; color: var(--hint); margin-top: 3px; }

  /* «+» живёт в нижней панели, а не висит поверх карточек — ничего не закрывает ни на одном экране */
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--sep); padding-bottom: var(--safe-bottom); z-index: 5; }
  nav .in { display: flex; max-width: 720px; height: var(--nav-h); margin: 0 auto; }
  nav button { flex: 1; min-width: 0; border: 0; background: none; padding: 6px 0 8px; font-size: 11px; color: var(--hint); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  nav button span { height: 30px; display: grid; place-items: center; font-size: 20px; line-height: 1; filter: grayscale(1); opacity: .7; }
  nav button.on { color: var(--accent); font-weight: 600; }
  nav button.on span { filter: none; opacity: 1; }
  nav button.add span { filter: none; opacity: 1; width: 46px; height: 30px; border-radius: 12px; display: grid; place-items: center; background: var(--accent); color: var(--accent-text); font-size: 24px; font-weight: 500; }
  nav button.add { color: var(--accent); }
  @media (hover: hover) { nav button:hover { color: var(--text); } .btn:hover { filter: brightness(1.06); } }

  .cal-head { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 8px; }
  .cal-head b { font-size: 17px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .wd { text-align: center; font-size: 11px; color: var(--hint); padding-bottom: 2px; }
  .day { background: var(--card); border-radius: 10px; min-height: 58px; padding: 4px; border: 2px solid transparent; cursor: pointer; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .day.out { opacity: .35; }
  .day.today { border-color: var(--accent); }
  .day.sel { background: var(--accent-bg); }
  .day .n { font-size: 12px; font-weight: 600; }
  .day .ev { font-size: 13px; line-height: 1.1; letter-spacing: -1px; }
  .day .dl { display: flex; gap: 2px; flex-wrap: wrap; }
  .day .dl i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .day .dl i.late { background: var(--danger); }
  .day .dl i.ok { background: var(--ok); }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: calc(var(--vh) - var(--safe-top) - 24px); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; background: var(--bg2); border-radius: 18px 18px 0 0; padding: 8px 12px calc(24px + var(--safe-bottom)); z-index: 21; display: none; max-width: 720px; margin: 0 auto; }
  .sheet.open, .sheet-bg.open { display: block; }
  .sheet .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--sep); margin: 2px auto 10px; }
  .sheet-title { display: flex; align-items: center; gap: 8px; margin: 0 4px 10px; }
  .sheet-title b { font-size: 18px; flex: 1; }

  label.f { display: block; margin-bottom: 10px; }
  label.f > span { display: block; font-size: 12px; color: var(--hint); margin: 0 2px 4px; }
  .inp { width: 100%; border: 1px solid var(--sep); background: var(--card); border-radius: 10px; padding: 9px 11px; outline: none; }
  .inp:focus { border-color: var(--accent); }
  textarea.inp { resize: vertical; min-height: 64px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stage-box { background: var(--card); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; }
  .stage-box .head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .stage-box select, .stage-box input[type=date] { border: 1px solid var(--sep); background: var(--bg2); border-radius: 8px; padding: 4px 6px; font-size: 13px; max-width: 46%; }
  .link-row { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-top: 1px solid var(--sep); }
  .link-row:first-child { border-top: 0; }
  .lang-row { display: grid; grid-template-columns: 64px 1fr 30px; gap: 6px; margin-bottom: 6px; }
  .toast { position: fixed; left: 0; right: 0; margin: 0 auto; width: fit-content; bottom: calc(90px + env(safe-area-inset-bottom)); background: rgba(20,20,20,.92); color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 14px; z-index: 50; display: none; max-width: calc(100vw - 24px); text-align: center; }
  .toast.show { display: flex; align-items: center; gap: 12px; }
  .toast-undo { border: 0; background: rgba(255,255,255,.18); color: #fff; font-weight: 600; border-radius: 8px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
  .banner { display: flex; align-items: center; gap: 8px; background: var(--danger-bg); color: var(--danger); border-radius: 12px; padding: 9px 12px; margin: 0 0 10px; font-size: 14px; }
  .note { border-radius: 10px; padding: 7px 10px; margin: 6px 0; font-size: 13px; background: var(--accent-bg); }
  .note.warn { background: var(--warn-bg); }
  .pgroup { margin-bottom: 4px; }
  .ph { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--hint); margin: 8px 4px 5px; }
  .onb-head { cursor: pointer; }
  .day .dl i.wait { background: transparent; box-shadow: inset 0 0 0 1px var(--hint); }
  .stripe-card { box-shadow: inset 4px 0 0 var(--pc, var(--accent)); }
  .loading { text-align: center; padding: 60px 16px; color: var(--hint); }
  .member { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--sep); }
  .member:first-child { border-top: 0; }
  .ava { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-bg); color: var(--accent); display: grid; place-items: center; font-weight: 700; }
  .clickable { cursor: pointer; }
  .list > .card:last-child { margin-bottom: 8px; }

  /* Статистика: плитки с цифрами и полосы по языкам (одна серия — один цвет, подложка — светлее того же цвета) */
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 8px; }
  .tile { background: var(--card); border-radius: var(--radius); padding: 10px 12px; min-width: 0; }
  .tile .v { font-size: 24px; font-weight: 600; line-height: 1.2; }
  .tile .l { font-size: 12px; color: var(--hint); }
  .tile.bad .v { color: var(--danger); }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; padding: 8px 0 3px; }
  .bar-row .bar { grid-column: 1 / -1; }
  .bar { height: 10px; border-radius: 4px; background: var(--accent-bg); overflow: hidden; }
  .bar b { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar-sub { padding: 0 0 8px; border-bottom: 1px solid var(--sep); }
  .bar-sub:last-child { border-bottom: 0; }
  .st-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 0; border-top: 1px solid var(--sep); }
  .st-row:first-child { border-top: 0; }
  .st-row .bar { grid-column: 1 / -1; height: 6px; }
  .ep-views { padding: 8px 0; border-top: 1px solid var(--sep); }
  .ep-views:first-child { border-top: 0; }
  .ep-views .chips { flex-wrap: wrap; padding-bottom: 0; margin-top: 6px; }
  .stale { opacity: .5; transition: opacity .15s; }

  /* Телефоны и планшеты с пальцем: поля от 16px, иначе iOS приближает страницу при вводе; кнопки крупнее */
  @media (pointer: coarse) {
    .inp, .stage-box select, .stage-box input[type=date] { font-size: 16px; }
    .btn.sm { padding: 8px 12px; }
    .icon-btn { padding: 8px 10px; }
  }

  /* Планшет и ПК: шире, карточки в две-три колонки, шторка — окно по центру, календарь рядом с днём */
  @media (min-width: 760px) {
    main { max-width: 1080px; padding: 16px 20px 28px; }
    .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 8px; align-items: start; }
    .list > .card, .list > .card:last-child { margin-bottom: 0; }
    .onb { max-width: 720px; }
    .cal-wrap { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; align-items: start; }
    .cal-wrap > .side > h2:first-child { margin-top: 0; }
    .day { min-height: 74px; }
    .settings { max-width: 760px; margin: 0 auto; }
    .tiles { grid-template-columns: repeat(4, 1fr); }
    .stats-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; align-items: start; }
    .sheet { left: 50%; right: auto; top: 50%; bottom: auto; transform: translate(-50%, -50%); width: min(640px, calc(100vw - 40px)); max-height: calc(var(--vh) - 48px); border-radius: 18px; padding: 12px 16px 20px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
    .sheet .grip { display: none; }
  }
  /* Мышь: строку фильтров вбок не прокрутить — переносим на новую строку */
  @media (hover: hover) and (pointer: fine) {
    .chips { flex-wrap: wrap; overflow: visible; }
  }
  /* Цвет проекта: на элементе задаётся --pc */
  .pdot { width: 9px; height: 9px; border-radius: 50%; background: var(--pc, var(--accent)); display: inline-block; flex-shrink: 0; }
  .pc-stripe { box-shadow: inset 4px 0 0 var(--pc, var(--accent)); }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer; background: var(--pc); box-shadow: 0 0 0 2px var(--bg2), 0 0 0 2px transparent; }
  .swatch.on { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--pc); }

  /* «Сейчас»: главная задача крупно */
  .hero { position: relative; border-radius: 20px; padding: 16px 16px 14px; margin-bottom: 10px; overflow: hidden;
    background: linear-gradient(140deg, color-mix(in srgb, var(--pc) 30%, var(--card)) 0%, var(--card) 72%);
    border: 1px solid color-mix(in srgb, var(--pc) 40%, transparent); }
  .hero .bg-emoji { position: absolute; right: -8px; top: -14px; font-size: 104px; opacity: .13; transform: rotate(12deg); pointer-events: none; }
  .hero .kicker { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--pc); display: flex; align-items: center; gap: 6px; }
  .hero .stage { font-size: 27px; font-weight: 800; line-height: 1.12; margin: 6px 0 4px; letter-spacing: -.01em; }
  .hero .ep { font-size: 15px; font-weight: 600; cursor: pointer; }
  .hero .due { display: inline-flex; gap: 6px; align-items: center; margin-top: 10px; font-weight: 700; font-size: 14px; padding: 5px 11px; border-radius: 999px; background: var(--bg2); }
  .hero .due.late { background: var(--danger-bg); color: var(--danger); }
  .hero .due.today { background: var(--warn-bg); color: var(--warn); }
  .hero .acts { display: flex; gap: 8px; margin-top: 14px; }
  .hero .acts .btn { flex: 1; padding: 12px; font-size: 15px; text-align: center; }
  .hero .progress { margin-top: 12px; }
  .counters { display: flex; gap: 6px; margin: 0 0 14px; flex-wrap: wrap; }
  .counter { display: flex; align-items: center; gap: 6px; background: var(--card); border-radius: 12px; padding: 7px 11px; font-size: 13px; color: var(--hint); }
  .counter b { font-size: 16px; color: var(--text); }
  .counter.bad b { color: var(--danger); }
  .next-row { display: flex; align-items: center; gap: 10px; padding: 11px 12px 11px 14px; background: var(--card); border-radius: 12px; margin-bottom: 6px; cursor: pointer; box-shadow: inset 4px 0 0 var(--pc, var(--accent)); }
  .next-row .t { flex: 1; min-width: 0; }
  .calm { text-align: center; padding: 26px 16px; }
  .calm .big { font-size: 46px; }
  /* Кнопки внизу экрана Telegram заменяют дубли на странице */
  .has-main .dup-main, .has-second .dup-second { display: none !important; }

  /* Доска выпусков по этапам */
  .seg { display: inline-flex; background: var(--card); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; padding: 5px 11px; border-radius: 8px; font-size: 13px; cursor: pointer; color: var(--hint); }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  .board { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -12px; padding: 2px 12px 12px; scrollbar-width: none; }
  .board::-webkit-scrollbar { display: none; }
  .col { flex: 0 0 min(78vw, 300px); scroll-snap-align: start; background: color-mix(in srgb, var(--card) 50%, transparent); border-radius: 16px; padding: 8px; min-height: 140px; }
  .col-h { display: flex; align-items: center; gap: 6px; padding: 4px 6px 8px; font-weight: 700; font-size: 14px; }
  .col-h .n { margin-left: auto; font-size: 12px; color: var(--hint); background: var(--bg2); border-radius: 999px; padding: 1px 8px; font-weight: 600; }
  .col-h .n.late { color: var(--danger); background: var(--danger-bg); }
  .kcard { background: var(--card); border-radius: 12px; padding: 9px 11px 9px 13px; margin-bottom: 7px; cursor: pointer; box-shadow: inset 4px 0 0 var(--pc); }
  .kcard .tt { font-size: 14px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
  .kcard .mt { display: flex; align-items: center; gap: 6px; margin-top: 7px; font-size: 12px; color: var(--hint); }
  .mini-ava { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--accent-bg); color: var(--accent); }
  .col-empty { color: var(--hint); font-size: 12.5px; text-align: center; padding: 18px 6px; }
  @media (min-width: 760px) {
    .board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); overflow: visible; margin: 0; padding: 2px 0 12px; }
    .col { flex: none; }
    .now-wrap { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
    .now-wrap > div > h2:first-child { margin-top: 0; }
  }
  @media (min-width: 760px) and (pointer: fine) {
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--sep); border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
  }
</style>
</head>
<body>
<main id="view"><div class="loading">Загрузка…</div></main>
<nav><div class="in" id="tabs"></div></nav>
<div class="sheet-bg" id="sheet-bg" data-act="close-sheet"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
let tg = window.Telegram && window.Telegram.WebApp;
const qs = new URLSearchParams(location.search);
const MOCK = qs.has("mock");
const FAKE_NATIVE = MOCK && qs.has("native");
const API_URL = (window.APP_CONFIG && window.APP_CONFIG.apiUrl) || "";
const FETCH_TIMEOUT_MS = 20000;
const NO_NET = "Нет связи с сервером, попробуй ещё раз";
// версия Telegram для макета ?native=1 (например &tgver=7.0 — проверить старый клиент без SecondaryButton)
const FAKE_VER = Number(qs.get("tgver")) || 9;

const STAGES = ["script", "voice", "edit", "upload"];
const META = {
  script: { e: "📝", n: "Сценарий" }, voice: { e: "🎙", n: "Озвучка" },
  edit: { e: "🎞", n: "Монтаж" }, upload: { e: "📤", n: "Выкладка" },
};
const PREV = { script: null, voice: "script", edit: "voice", upload: "edit" };
const WD = ["пн", "вт", "ср", "чт", "пт", "сб", "вс"];

function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem("yt." + k);
    localStorage.setItem("yt." + k, v);
  } catch (_) { return null; }
}

// ---------- утилиты ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// язык — всегда кодом (RU), без флагов: флаг — это страна, а не язык, и на Windows он не рисуется
const langTag = (l) => String(l || "?").toUpperCase();
const dParse = (d) => new Date(d + "T00:00:00Z");
const addDays = (d, n) => { const x = dParse(d); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const weekday = (d) => (dParse(d).getUTCDay() + 6) % 7;
const daysBetween = (a, b) => Math.round((dParse(b) - dParse(a)) / 86400000);
function fmt(d, wd) {
  if (!d) return "";
  const [, m, day] = d.split("-").map(Number);
  return (wd ? WD[weekday(d)] + ", " : "") + day + " " + MON[m - 1];
}
function rel(d) {
  const n = daysBetween(S.today, d);
  if (n === 0) return "сегодня";
  if (n === 1) return "завтра";
  if (n === -1) return "вчера";
  return n < 0 ? `${-n} дн. назад` : `через ${n} дн.`;
}
function dueBadge(d, done) {
  if (!d) return "";
  if (done) return `<span class="badge ok">✓</span>`;
  const n = daysBetween(S.today, d);
  const cls = n < 0 ? "late" : n === 0 ? "today" : "";
  return `<span class="badge ${cls}">${n < 0 ? "⚠️ " : ""}${fmt(d)}</span>`;
}
const haptic = (t) => { try { tg && tg.HapticFeedback && (t === "light" ? tg.HapticFeedback.impactOccurred("light") : tg.HapticFeedback.notificationOccurred(t)); } catch (_) {} };
/** Тост; {undo} добавляет кнопку «Отменить» на 5 секунд (undo — функция, возвращающая промис). */
function toast(msg, opt = {}) {
  const el = document.getElementById("toast");
  el.textContent = "";
  const text = document.createElement("span");
  text.textContent = msg;
  el.append(text);
  if (opt.undo) {
    const b = document.createElement("button");
    b.className = "toast-undo";
    b.textContent = "Отменить";
    b.onclick = () => { clearTimeout(toast.t); el.classList.remove("show"); opt.undo(); };
    el.append(b);
  }
  el.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove("show"), opt.undo ? 5000 : 2600);
}
function confirmBox(text) {
  return new Promise((res) => {
    if (tg && tg.showConfirm && tg.initData) tg.showConfirm(text, (ok) => res(ok));
    else res(window.confirm(text));
  });
}

/**
 * Голова подписи выпуска «🔭 Скрытая Физика · S04» — зеркало episodeLabel на сервере (обычный текст, esc делает вызывающий).
 * full добавляет «название»; short — для тесных мест: «🔭 S04».
 */
function epHead(e) {
  const p = proj(e.project_id) || { emoji: "", name: "" };
  return `${p.emoji} ${p.name} · ${e.code}`;
}
function epLabel(e, mode = "full") {
  const p = proj(e.project_id) || { emoji: "", name: "" };
  if (mode === "short") return `${p.emoji} ${e.code}`;
  const tag = formatTag(e.notes);
  return epHead(e) + (e.title ? ` «${e.title}»` : "") + (tag ? ` · ${tag}` : "");
}
/** 2D или 3D (Blender) из заметок выпуска — зеркало formatTag на сервере. */
function formatTag(notes) {
  const m = (notes || "").match(/(?:^|[^a-z0-9])([23])d(?![a-z0-9])/i);
  return m ? `${m[1]}D` : null;
}
/** HTML-строка выпуска: жирная голова + название (для карточек и списков) + 2D/3D. */
const epHtml = (e) => {
  const tag = formatTag(e.notes);
  return `<b>${esc(epHead(e))}</b> ${esc(e.title)}${tag ? ` <span class="muted">· ${tag}</span>` : ""}`;
};
/** Для нижней кнопки Telegram: проект и код без названия — иначе кнопка не помещается. */
function epBtn(e) {
  const p = proj(e.project_id) || { emoji: "", name: "" };
  return `${p.emoji} ${p.name} ${e.code}`;
}
/** Сжатый график: срок сценария уже в прошлом (зеркало isCompressed на сервере). */
function isCompressedFor(p, publishDate) {
  return !!publishDate && addDays(publishDate, -(p.script_offset || 0)) < S.today;
}
/** Подсказка про озвучку по настройке проекта (а не зашитое «в день сценария»). */
function voiceHint(p) {
  if (p.voice_days == null) return `озвучка за ${p.voice_offset} дн. до выхода`;
  if (p.voice_days === 0) return "озвучка в день, когда придёт сценарий";
  return `озвучка через ${p.voice_days} дн. после сценария`;
}
const epTasks = (id) => S.tasks.filter((t) => t.episode_id === id);
const projChannels = (pid) => S.channels.filter((c) => c.project_id === pid).sort((a, b) => a.sort - b.sort);
const chSort = (t) => (chan(t.channel_id) || { sort: -1 }).sort;

function blocker(t) {
  const prev = PREV[t.stage];
  if (!prev) return null;
  // свой язык, если этап шёл по языкам; иначе общая задача на все языки (как на сервере)
  const same = S.tasks.filter((x) => x.episode_id === t.episode_id && x.stage === prev);
  return same.find((x) => x.channel_id === t.channel_id) || same.find((x) => x.channel_id == null) || null;
}
function isActive(t) {
  if (t.done_at) return false;
  const b = blocker(t);
  return !b || !!b.done_at;
}
const pcolor = (p) => (p && p.color) || PALETTE[Math.max(0, S.projects.indexOf(p)) % PALETTE.length];
const pc = (p) => `--pc:${pcolor(p)}`;
const initial = (m) => esc(((m && m.name) || "?").slice(0, 1).toUpperCase());
const topicBound = (pid, kind) => (S.topics || []).some((t) => t.project_id === pid && t.kind === kind) || !!(proj(pid) || {}).thread_id;
const topicStatus = (p) => KINDS.map((k) => k.e + (topicBound(p.id, k.id) ? "✅" : "⚠️")).join(" ");
function stageInfo(eid, stage) {
  const ts = epTasks(eid).filter((t) => t.stage === stage).sort((a, b) => chSort(a) - chSort(b));
  const done = ts.filter((t) => t.done_at).length;
  const active = ts.filter(isActive).length;
  const due = ts.map((t) => t.due_date).filter(Boolean).sort()[0] || null;
  const late = done < ts.length && active > 0 && due && due < S.today;
  return { ts, done, total: ts.length, active, due, late };
}
function episodeDone(eid) {
  const ts = epTasks(eid);
  return ts.length > 0 && ts.every((t) => t.done_at);
}

/** Один запрос к серверу: таймаут и русский текст вместо «Failed to fetch» / «AbortError». */
async function rawFetch(url, action, body, timeoutMs = FETCH_TIMEOUT_MS) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs);
  let res;
  try {
    res = await fetch(url, {
      method: "POST",
      headers: { "content-type": "application/json", "x-init-data": (tg && tg.initData) || "" },
      body: JSON.stringify({ action, ...body }),
      signal: ctl.signal,
    });
  } catch (_) {
    throw new Error(NO_NET);
  } finally {
    clearTimeout(timer);
  }
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `Сервер ответил ошибкой ${res.status}, попробуй ещё раз`);
  return json;
}

async function api(action, body = {}) {
  if (MOCK) return window.MOCK_API(action, body);
  if (!API_URL) throw new Error("Не задан адрес API (config.js)");
  return rawFetch(API_URL, action, body);
}

// ---------- замок запросов ----------
// Одновременно идёт один запрос-изменение. Повтор того же самого нажатия (двойной клик по «Готово» / MainButton)
// отбрасывается, другое действие ждёт своей очереди — иначе второй клик закрывал уже следующий этап или делал второй выпуск.
let busy = null;

/** Кнопка и MainButton показывают, что запрос идёт; повторные нажатия в это время не проходят. */
function setBusyUI(on, el) {
  document.body.classList.toggle("busy", on);
  if (el && el.classList) { el.classList.toggle("is-busy", on); if ("disabled" in el) el.disabled = on; }
  try {
    if (hasMain()) { if (on) tg.MainButton.showProgress(false); else tg.MainButton.hideProgress(); }
  } catch (_) {}
}

/**
 * Запрос-изменение → тост → перезагрузка. opts: el — нажатая кнопка (блокируется до ответа),
 * undo — функция «Отменить» для тоста, commit — ключи полей data-keep, которые после успеха берутся с сервера, а не из набранного.
 * Возвращает ответ ({} если пустой) или null при ошибке/отброшенном повторе.
 */
async function act(action, body, msg, opts = {}) {
  const key = action + ":" + JSON.stringify(body);
  while (busy) {
    if (busy.key === key) return null;
    await busy.done;
  }
  let release;
  busy = { key, done: new Promise((r) => (release = r)) };
  setBusyUI(true, opts.el);
  ui.skipKeep = opts.commit ? new Set(opts.commit) : null;
  try {
    const r = await api(action, body);
    haptic("success");
    await load();
    if (msg) toast(msg, opts.undo ? { undo: opts.undo } : {});
    return r || {};
  } catch (e) {
    haptic("error");
    toast(e.message);
    return null;
  } finally {
    ui.skipKeep = null;
    busy = null;
    setBusyUI(false, opts.el);
    release();
  }
}

/**
 * Отметить этапы готовыми с тостом «Отменить» (5 с). «Отменить» — только если отметил именно этот запрос
 * (changed > 0), и снимает только задачи, которые он поменял: чужую отметку (Павел успел раньше) не трогаем.
 */
async function markDone(ids, el) {
  const r = await act("tasks.done", { ids, done: true }, null, { el });
  if (!r) return r;
  if (r.changed > 0) {
    const mine = Array.isArray(r.ids) && r.ids.length ? r.ids : ids;
    const t = S.tasks.find((x) => x.id === mine[0]);
    const e = t && ep(t.episode_id);
    const msg = e ? `✅ ${META[t.stage].n} · ${epLabel(e)}` : "✅ Отмечено";
    toast(msg, { undo: () => act("tasks.done", { ids: mine, done: false }, "Отметка снята") });
  } else toast("Уже отмечено");
  return r;
}

// ---------- рендер ----------
// Перерисовка целиком сносит поля. Поля с data-keep="ключ" перед этим запоминаются (если их правили или в них курсор)
// и возвращаются на место вместе с фокусом и выделением.
const KEEP_SEL = "[data-keep],[data-pf],[data-role],[data-ch]";
// у полей шторки проекта ключ выводится из data-pf / data-role / data-ch
const keepKey = (el) => el.dataset.keep || (el.dataset.pf && "pf:" + el.dataset.pf) || (el.dataset.role && "role:" + el.dataset.role)
  || (el.dataset.ch != null && el.dataset.k ? `ch:${el.dataset.ch}:${el.dataset.k}` : null);
function snapKeep() {
  const snap = { vals: {}, focus: null };
  document.querySelectorAll(KEEP_SEL).forEach((el) => {
    const k = keepKey(el);
    let dirty;
    if (el.type === "checkbox") dirty = el.checked !== el.defaultChecked;
    else if (el.tagName === "SELECT") dirty = el.selectedIndex !== Math.max(0, [...el.options].findIndex((o) => o.defaultSelected));
    else dirty = el.value !== el.defaultValue;
    if (dirty) snap.vals[k] = el.type === "checkbox" ? el.checked : el.value;
  });
  const a = document.activeElement;
  if (a && a.dataset && keepKey(a)) {
    let s = null, e = null;
    try { s = a.selectionStart; e = a.selectionEnd; } catch (_) {}
    snap.focus = { k: keepKey(a), s, e };
  }
  return snap;
}
function restoreKeep(snap) {
  const skip = ui.skipKeep;
  document.querySelectorAll(KEEP_SEL).forEach((el) => {
    const k = keepKey(el);
    if (!(k in snap.vals) || (skip && skip.has(k))) return;
    if (el.type === "checkbox") el.checked = snap.vals[k]; else el.value = snap.vals[k];
  });
  if (snap.focus) {
    const el = [...document.querySelectorAll(KEEP_SEL)].find((x) => keepKey(x) === snap.focus.k);
    if (el) {
      el.focus({ preventScroll: true });
      try { if (snap.focus.s != null && !(skip && skip.has(snap.focus.k))) el.setSelectionRange(snap.focus.s, snap.focus.e); } catch (_) {}
    }
  }
}

function setupSteps() {
  const ps = S.projects;
  const kindsOk = (p) => KINDS.filter((k) => topicBound(p.id, k.id)).length;
  const topicsOk = ps.reduce((n, p) => n + kindsOk(p), 0);
  const noTopics = ps.find((p) => kindsOk(p) < KINDS.length);
  const noRoles = ps.find((p) => STAGES.some((st) => !(S.roles.find((r) => r.project_id === p.id && r.stage === st) || {}).member_id));
  const chans = S.channels.filter((c) => ps.some((p) => p.id === c.project_id));
  const noYt = ps.find((p) => projChannels(p.id).some((c) => !c.youtube_url));
  return [
    { ok: S.settings.group_linked, t: "Группа подключена", hint: "Добавь бота в группу админом" },
    { ok: S.drive && S.drive.enabled, t: "Google Диск подключён", hint: "Нужен ключ Google (файл google-sa.json)" },
    { ok: ps.length > 0, t: ps.length ? `Проекты: ${ps.length}` : "Создать проекты", btn: ["+ Проект", 0] },
    { ok: ps.length > 0 && !noTopics, t: `Темы в группе: ${topicsOk} из ${ps.length * KINDS.length}`, btn: noTopics && ["Настроить", noTopics.id] },
    { ok: S.members.length >= 2, t: `В команде: ${S.members.length} чел.`, hint: "Напарник появится, когда напишет боту /start или любое сообщение в группе" },
    { ok: ps.length > 0 && !noRoles, t: "Ответственные назначены", btn: noRoles && ["Назначить", noRoles.id] },
    { ok: chans.length > 0 && !noYt, optional: true, t: `YouTube-каналы: ${chans.filter((c) => c.youtube_url).length} из ${chans.length}`, hint: "Необязательно: тогда бот сам отметит выкладку, увидев ролик на канале", btn: noYt && ["Добавить", noYt.id] },
  ];
}

/**
 * Чек-лист настройки. На рабочих вкладках — пока не готово обязательное;
 * необязательное (ссылки на YouTube) напоминаем только в «Настройках».
 */
function onboarding(where) {
  if (!S.me.is_admin) return "";
  const steps = setupSteps();
  const required = steps.filter((x) => !x.optional);
  if (where === "settings" ? steps.every((x) => x.ok) : required.every((x) => x.ok)) return "";
  const done = required.filter((x) => x.ok).length;
  // свёрнутая карточка помнится: настройка не должна занимать первый экран каждый раз
  if (store("onbCollapsed") === "1") {
    return `<div class="card onb onb-head" data-act="toggle-onb"><div class="row"><b class="grow">🚀 Настройка</b><span class="badge">${done} из ${required.length}</span><span class="muted">▸</span></div></div>`;
  }
  return `<div class="card onb"><div class="row onb-head" data-act="toggle-onb"><b class="grow">🚀 Настройка</b><span class="badge">${done} из ${required.length}</span><span class="muted">▾</span></div>
    ${steps.map((x) => `<div class="row" style="padding:7px 0;border-top:1px solid var(--sep)"><span>${x.ok ? "✅" : x.optional ? "💡" : "⬜"}</span>
      <div class="grow small">${esc(x.t)}${!x.ok && x.hint ? `<div class="muted">${esc(x.hint)}</div>` : ""}</div>
      ${!x.ok && x.btn ? `<button class="btn sm" data-act="edit-project" data-id="${x.btn[1]}">${esc(x.btn[0])}</button>` : ""}</div>`).join("")}</div>`;
}

// --- Мои задачи
function nowGroups(all) {
  const me = S.me.tg_id;
  const open = S.tasks.filter((t) => !t.done_at && (all || t.assignee_id === me));
  const map = new Map();
  for (const t of open) {
    const k = t.episode_id + ":" + t.stage;
    if (!map.has(k)) map.set(k, { eid: t.episode_id, stage: t.stage });
  }
  return [...map.values()].map((g) => {
    const info = stageInfo(g.eid, g.stage);
    const mine = info.ts.filter((t) => !t.done_at && (all || t.assignee_id === me));
    const activeMine = mine.filter(isActive);
    const due = activeMine.map((t) => t.due_date).filter(Boolean).sort()[0] || info.due;
    return { ...g, info, activeMine, due, waiting: activeMine.length === 0, who: [...new Set(mine.map((t) => t.assignee_id))].map(mem).filter(Boolean) };
  }).filter((g) => ep(g.eid)).sort((a, b) => (a.due || "9").localeCompare(b.due || "9"));
}

/** Разложить по корзинам: горит (срок ≤ сегодня), дальше (до 7 дней или без срока), позже, ждёт. */
function nowBuckets(groups, skip) {
  const rest = groups.filter((g) => g !== skip);
  const active = rest.filter((g) => !g.waiting);
  const hot = active.filter((g) => g.due && g.due <= S.today);
  const later = active.filter((g) => g.due && g.due > S.today && daysBetween(S.today, g.due) > 7);
  const next = active.filter((g) => !hot.includes(g) && !later.includes(g));
  return { hot, next, later, waiting: rest.filter((g) => g.waiting) };
}

function langChip(t) {
  const c = chan(t.channel_id);
  const st = t.done_at ? "done" : isActive(t) ? "active" : "blocked";
  return `<button class="chip lang ${st}" data-act="toggle" data-id="${t.id}">${esc(langTag(c && c.lang))}${t.done_at ? " ✓" : ""}</button>`;
}

/** Прогресс выпуска по 4 этапам (зелёная заливка, красный — просрочено, синий — в работе). */
function progressBars(eid) {
  return `<div class="progress">${STAGES.map((st) => {
    const i = stageInfo(eid, st);
    const pct = i.total ? Math.round(i.done / i.total * 100) : 0;
    return `<i class="${i.late ? "late" : i.active ? "active" : ""}" title="${META[st].n}"><b style="width:${pct}%"></b></i>`;
  }).join("")}</div>`;
}

function dueText(due) {
  if (!due) return { t: "без срока", cls: "" };
  const n = daysBetween(S.today, due);
  if (n < 0) return { t: `⚠️ просрочено на ${-n} дн.`, cls: "late" };
  if (n === 0) return { t: "🔥 срок сегодня", cls: "today" };
  if (n === 1) return { t: "⏰ срок завтра", cls: "" };
  return { t: `📅 до ${fmt(due, true)}`, cls: "" };
}

/** Главная задача: самая срочная из тех, что можно делать прямо сейчас. */
function heroCard(g) {
  const e = ep(g.eid), p = proj(e.project_id), m = META[g.stage];
  const d = dueText(g.due);
  const single = g.info.total === 1 && !g.info.ts[0].channel_id;
  const langs = single ? "" : `<div class="chips" style="margin-top:10px;flex-wrap:wrap">${g.info.ts.map(langChip).join("")}</div>`;
  const done = g.activeMine.length > 1
    ? `<button class="btn dup-main" data-act="done" data-ids="${g.activeMine.map((t) => t.id).join(",")}">✅ Все ${g.activeMine.length} готовы</button>`
    : g.activeMine.length === 1 && single ? `<button class="btn dup-main" data-act="done" data-ids="${g.activeMine[0].id}">✅ Готово</button>` : "";
  const folder = e.drive_folder_id ? `<a class="btn ghost dup-second" href="${folderLink(e.drive_folder_id)}" data-act="open-link">📁 Папка</a>` : "";
  return `<div class="hero" style="${pc(p)}">
    <div class="bg-emoji">${m.e}</div>
    <div class="kicker"><span class="pdot"></span>главное сейчас</div>
    <div class="stage">${m.e} ${m.n}</div>
    <div class="ep" data-act="open-episode" data-id="${e.id}">${esc(epLabel(e))} ›</div>
    <div class="muted small">выход ${fmt(e.publish_date, true)} · ${rel(e.publish_date)}</div>
    <span class="due ${d.cls}">${d.t}</span>${langs}
    ${progressBars(e.id)}
    ${folder || done ? `<div class="acts">${folder}${done}</div>` : ""}
  </div>`;
}

/** Строка задачи в «Горит / Дальше / Ждёт»; под заголовком проекта выпуск подписан коротко («🔭 S04»). */
function nextRow(g) {
  const e = ep(g.eid), p = proj(e.project_id), m = META[g.stage];
  const who = ui.nowAll && g.who.length ? ` · ${g.who.map((x) => esc(x.name)).join(", ")}` : "";
  const sub = g.waiting ? `⏳ ждёт ${META[PREV[g.stage]].n.toLowerCase()}` : "";
  return `<div class="next-row" style="${pc(p)}" data-act="open-episode" data-id="${e.id}">
    <span style="font-size:18px">${m.e}</span>
    <div class="t"><div class="ellipsis"><b>${esc(epLabel(e, "short"))}</b> ${esc(e.title)}</div>
      <div class="muted small ellipsis">${m.n}${sub ? ` · ${sub}` : ""}${who}</div></div>
    ${g.waiting ? `<span class="badge">⏳</span>` : dueBadge(g.due)}</div>`;
}

/** Секция списка: заголовок и строки, сгруппированные по проектам. */
function nowSection(title, groups) {
  if (!groups.length) return "";
  const rows = S.projects.map((p) => ({ p, gs: groups.filter((g) => ep(g.eid).project_id === p.id) })).filter((x) => x.gs.length);
  return title + rows.map(({ p, gs }) => `<div class="pgroup" style="${pc(p)}"><div class="ph"><span class="pdot"></span>${esc(p.emoji)} ${esc(p.name)}</div>${gs.map(nextRow).join("")}</div>`).join("");
}

/** Кого ждём: для моих задач, которые ещё нельзя начать, — чей предыдущий этап. */
function waitingFor(g) {
  const t = g.info.ts.find((x) => !x.done_at);
  const b = t && blocker(t);
  const who = b && mem(b.assignee_id);
  return b ? `${META[b.stage].e} ${META[b.stage].n.toLowerCase()} ${esc(epLabel(ep(g.eid), "short"))}${who ? ` от ${esc(who.name)}` : ""}` : "";
}

function viewMy() {
  const all = ui.nowAll;
  const gs = nowGroups(all);
  // главная карточка и кнопка Telegram — только в «Мои»: в «Все» чужие задачи отмечать отсюда не надо
  const hero = all ? null : gs.find((g) => !g.waiting) || null;
  ui.hero = hero;
  const b = nowBuckets(gs, hero);
  const unassigned = S.tasks.filter((t) => !t.done_at && t.assignee_id == null).length;
  let html = onboarding();
  html += `<div class="row" style="margin:0 4px 10px"><div class="grow"><div style="font-size:20px;font-weight:800">Привет, ${esc(S.me.name)} 👋</div>
    <div class="muted">${fmt(S.today, true)}</div></div>
    <div class="seg"><button class="${all ? "" : "on"}" data-act="now-all" data-v="0">Мои</button><button class="${all ? "on" : ""}" data-act="now-all" data-v="1">Все</button></div></div>`;
  if (!S.projects.length) return html;
  const left = [];
  if (hero) left.push(heroCard(hero));
  else if (!all || !gs.length) {
    const w = b.waiting[0];
    left.push(`<div class="card calm"><div class="big">${all ? "🗂" : "🎉"}</div><b>${all ? "Открытых задач нет" : "✅ Всё сделано"}</b>
      <div class="muted small" style="margin-top:4px">${all ? "Новый выпуск — кнопка «+»." : w ? `Дальше ждём: ${waitingFor(w)}` : (b.next[0] || b.later[0]) ? `Следующее: ${esc(epLabel(ep((b.next[0] || b.later[0]).eid), "short"))}, ${META[(b.next[0] || b.later[0]).stage].n.toLowerCase()}` : "Отдыхай или запланируй новый выпуск кнопкой «+»."}</div></div>`);
  }
  const right = [];
  right.push(nowSection(`<h2>🔥 Горит · ${b.hot.length}</h2>`, b.hot));
  right.push(nowSection(`<h2>Дальше · ${b.next.length}</h2>`, b.next));
  if (b.later.length) right.push(`<div class="muted small" style="margin:8px 4px">Ещё позже: ${b.later.length} ${b.later.length === 1 ? "задача" : "задач(и)"}${all ? "" : " — они в «Выпусках»"}.</div>`);
  if (b.waiting.length) {
    right.push(`<h2 class="clickable" data-act="toggle-waiting">${ui.showWaiting ? "▾" : "▸"} ⏳ Ждёт${all ? "" : " других"} · ${b.waiting.length}</h2>`);
    if (ui.showWaiting) right.push(nowSection("", b.waiting));
  }
  if (unassigned) right.push(`<div class="card small" style="margin-top:8px">⚠️ ${unassigned} задач(и) без ответственного — назначь роли в <a href="#" data-act="tab" data-tab="settings">Настройках</a>.</div>`);
  return html + `<div class="now-wrap"><div>${left.join("")}</div><div>${right.join("")}</div></div>`;
}

// --- Выпуски
function projectChips() {
  return `<div class="chips"><button class="chip ${ui.project === "all" ? "on" : ""}" data-act="filter" data-p="all">Все</button>${
    S.projects.map((p) => `<button class="chip ${String(p.id) === ui.project ? "on" : ""}" data-act="filter" data-p="${p.id}"><span class="pdot" style="${pc(p)}"></span>${esc(p.emoji)} ${esc(p.name)}</button>`).join("")}</div>`;
}

function episodeRow(e) {
  const p = proj(e.project_id);
  const bars = STAGES.map((st) => {
    const i = stageInfo(e.id, st);
    const pct = i.total ? Math.round(i.done / i.total * 100) : 0;
    return `<i class="${i.late ? "late" : i.active ? "active" : ""}" title="${META[st].n}"><b style="width:${pct}%"></b></i>`;
  }).join("");
  const done = episodeDone(e.id);
  const anyLate = STAGES.some((st) => stageInfo(e.id, st).late);
  const badge = done ? `<span class="badge ok">готово</span>` : `<span class="badge ${anyLate ? "late" : daysBetween(S.today, e.publish_date) <= 0 ? "today" : ""}">${fmt(e.publish_date)}</span>`;
  return `<div class="card clickable pc-stripe" style="${pc(p)}" data-act="open-episode" data-id="${e.id}">
    <div class="row"><div class="grow"><div class="ellipsis">${epHtml(e)}</div>
    <div class="muted ellipsis">выход ${fmt(e.publish_date, true)} · ${rel(e.publish_date)}</div></div>${badge}</div>
    <div class="progress">${bars}</div>
    <div class="stage-labels">${STAGES.map((s) => `<span>${META[s].e} ${META[s].n}</span>`).join("")}</div></div>`;
}

/** На каком этапе выпуск: первый незакрытый; всё закрыто — «Вышло». */
function epColumn(eid) {
  for (const st of STAGES) {
    const i = stageInfo(eid, st);
    if (i.total && i.done < i.total) return st;
  }
  return "done";
}
const COLS = [...STAGES.map((id) => ({ id, e: META[id].e, n: META[id].n })), { id: "done", e: "🎉", n: "Вышло" }];

function kanbanCard(e, col) {
  const p = proj(e.project_id);
  let meta = "";
  if (col === "done") meta = `<span style="margin-left:auto" class="badge ok">${fmt(e.publish_date)}</span>`;
  else {
    const i = stageInfo(e.id, col);
    const who = [...new Set(i.ts.filter((t) => !t.done_at).map((t) => t.assignee_id))].map(mem).filter(Boolean);
    meta = who.map((m) => `<span class="mini-ava" title="${esc(m.name)}">${initial(m)}</span>`).join("")
      + (i.total > 1 ? `<span class="num">${i.done}/${i.total}</span>` : "")
      + (!i.active ? `<span title="ждёт предыдущий этап">⏳</span>` : "")
      + `<span style="margin-left:auto">${i.active ? dueBadge(i.due) : `<span class="badge">выход ${fmt(e.publish_date)}</span>`}</span>`;
  }
  return `<div class="kcard" style="${pc(p)}" data-act="open-episode" data-id="${e.id}">
    <div class="muted small ellipsis"><b style="color:var(--text)">${esc(epHead(e))}</b></div>
    <div class="tt">${esc(e.title)}</div><div class="mt">${meta}</div></div>`;
}

function viewEpisodes() {
  const list = S.episodes.filter((e) => ui.project === "all" || String(e.project_id) === ui.project);
  const mode = ui.epView || "board";
  let html = onboarding() + `<div class="row" style="margin-bottom:6px"><div class="grow" style="min-width:0">${projectChips()}</div></div>
    <div class="row" style="margin:0 0 10px"><div class="seg"><button class="${mode === "board" ? "on" : ""}" data-act="ep-view" data-v="board">▦ Доска</button><button class="${mode === "list" ? "on" : ""}" data-act="ep-view" data-v="list">☰ Список</button></div></div>`;
  if (!list.length) return html + (S.projects.length ? `<div class="empty">Выпусков пока нет.<br>Жми «+», чтобы добавить.</div>` : "");
  if (mode === "list") {
    const done = list.filter((e) => episodeDone(e.id));
    const active = list.filter((e) => !episodeDone(e.id));
    html += active.length ? `<div class="list">${active.map(episodeRow).join("")}</div>` : `<div class="empty">Активных выпусков нет.</div>`;
    if (done.length) {
      html += `<h2 class="clickable" data-act="toggle-done">${ui.showDone ? "▾" : "▸"} Готовые (${done.length})</h2>`;
      if (ui.showDone) html += `<div class="list">${done.slice().reverse().map(episodeRow).join("")}</div>`;
    }
    return html;
  }
  const byCol = Object.fromEntries(COLS.map((c) => [c.id, []]));
  for (const e of list) byCol[epColumn(e.id)].push(e);
  const dueOf = (e, col) => (col === "done" ? e.publish_date : stageInfo(e.id, col).due || e.publish_date);
  html += `<div class="board">${COLS.map((c) => {
    let items = byCol[c.id].slice().sort((a, b) => dueOf(a, c.id).localeCompare(dueOf(b, c.id)));
    let more = "";
    if (c.id === "done") {
      items = items.reverse();
      if (!ui.showDone && items.length > 6) {
        more = `<button class="btn ghost sm block" data-act="toggle-done">Ещё ${items.length - 6}</button>`;
        items = items.slice(0, 6);
      }
    }
    const late = c.id !== "done" && items.some((e) => stageInfo(e.id, c.id).late);
    return `<div class="col"><div class="col-h"><span>${c.e}</span>${c.n}<span class="n ${late ? "late" : ""}">${byCol[c.id].length}</span></div>
      ${items.map((e) => kanbanCard(e, c.id)).join("") || `<div class="col-empty">пусто</div>`}${more}</div>`;
  }).join("")}</div>
  <div class="muted small" style="margin:0 4px">Выпуск стоит в колонке этапа, который ещё не закрыт. ⏳ — ждёт предыдущий этап.</div>`;
  return html;
}

// --- Календарь
function dayEvents(d) {
  const pubs = S.episodes.filter((e) => e.publish_date === d && (ui.project === "all" || String(e.project_id) === ui.project));
  const map = new Map();
  for (const t of S.tasks) {
    if (t.due_date !== d || t.stage === "upload") continue;
    const e = ep(t.episode_id);
    if (!e || (ui.project !== "all" && String(e.project_id) !== ui.project)) continue;
    const k = t.episode_id + ":" + t.stage;
    const g = map.get(k) || { eid: t.episode_id, stage: t.stage, open: 0, total: 0, active: 0 };
    g.total++;
    if (!t.done_at) g.open++;
    if (isActive(t)) g.active++;
    map.set(k, g);
  }
  // этап ещё нельзя начать: открыт, но ни одна его задача не активна (ждёт предыдущий этап)
  const dls = [...map.values()].map((g) => ({ ...g, waiting: g.open > 0 && g.active === 0 }));
  return { pubs, dls };
}

function viewCalendar() {
  const [y, m] = ui.month.split("-").map(Number);
  const first = `${ui.month}-01`;
  const start = addDays(first, -weekday(first));
  let cells = "";
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i);
    if (i >= 35 && d.slice(0, 7) !== ui.month) break;
    const { pubs, dls } = dayEvents(d);
    const cls = ["day", d.slice(0, 7) !== ui.month && "out", d === S.today && "today", d === ui.day && "sel"].filter(Boolean).join(" ");
    const ev = pubs.slice(0, 4).map((e) => episodeDone(e.id) ? "✅" : esc(proj(e.project_id).emoji)).join("") + (pubs.length > 4 ? "…" : "");
    const dots = dls.slice(0, 8).map((g) => `<i class="${g.open === 0 ? "ok" : g.waiting ? "wait" : d < S.today ? "late" : ""}" style="${g.open === 0 || g.waiting || d < S.today ? "" : "background:" + pcolor(proj(ep(g.eid).project_id))}"></i>`).join("");
    cells += `<div class="${cls}" data-act="day" data-d="${d}"><span class="n">${Number(d.slice(8))}</span><span class="ev">${ev}</span><span class="dl">${dots}</span></div>`;
  }
  let html = projectChips() + `<div class="cal-wrap"><div>`;
  html += `<div class="cal-head"><button class="btn ghost sm" data-act="month" data-dir="-1">‹</button><b>${MONTHS[m - 1]} ${y}</b><button class="btn ghost sm" data-act="month" data-dir="1">›</button></div>`;
  html += `<div class="cal">${WD.map((w) => `<div class="wd">${w}</div>`).join("")}${cells}</div>`;
  html += `<div class="muted small" style="margin:8px 4px">Значок проекта — день выхода, точки — сроки этапов (красные — просрочены, зелёные — сделаны, пустые — ждут предыдущий этап).</div></div><div class="side">`;
  const d = ui.day || S.today;
  const { pubs, dls } = dayEvents(d);
  html += `<h2>${fmt(d, true)}${d === S.today ? " · сегодня" : ""}</h2>`;
  if (!pubs.length && !dls.length) html += `<div class="card muted">Ничего не запланировано</div>`;
  for (const e of pubs) {
    const p = proj(e.project_id);
    html += `<div class="card clickable row pc-stripe" style="${pc(p)}" data-act="open-episode" data-id="${e.id}"><div class="grow"><b>📤 Выход</b> · ${esc(epHead(e))}<div class="muted ellipsis">«${esc(e.title)}» · ${projChannels(p.id).length} каналов</div></div>${episodeDone(e.id) ? `<span class="badge ok">готово</span>` : ""}</div>`;
  }
  for (const g of dls) {
    const e = ep(g.eid), p = proj(e.project_id);
    const who = [...new Set(epTasks(e.id).filter((t) => t.stage === g.stage).map((t) => (mem(t.assignee_id) || { name: "—" }).name))].join(", ");
    const prev = PREV[g.stage] ? META[PREV[g.stage]].n.toLowerCase() : "";
    html += `<div class="card clickable row pc-stripe" style="${pc(p)}" data-act="open-episode" data-id="${e.id}"><div class="grow"><b>${META[g.stage].e} ${META[g.stage].n}</b> · ${esc(epHead(e))}<div class="muted ellipsis">${esc(who)} · «${esc(e.title)}»</div></div><span class="badge ${g.open === 0 ? "ok" : g.waiting ? "" : d < S.today ? "late" : ""}">${g.open === 0 ? "✓" : g.waiting ? `⏳ ждёт ${esc(prev)}` : g.total > 1 ? `${g.total - g.open}/${g.total}` : "срок"}</span></div>`;
  }
  return html + `</div></div>`;
}

// --- Статистика
const fmtNum = (n) => {
  if (n == null) return "—";
  const a = Math.abs(n), r = (x) => Math.round(x * 10) / 10;
  if (a < 1000) return String(Math.round(n));
  return a < 1e6 ? (r(n / 1000) + "k").replace(".0k", "k") : (r(n / 1e6) + "M").replace(".0M", "M");
};
const signed = (n) => (n == null ? "—" : (n > 0 ? "+" : "") + fmtNum(n));
/** Подпись канала: своё имя, если задано, иначе «Аксиома RU» — проект и язык. */
function chName(channelId, lang) {
  const c = chan(channelId);
  if (c && c.name) return c.name;
  const p = c && proj(c.project_id);
  return `${p ? p.name : ""} ${String(lang || (c && c.lang) || "").toUpperCase()}`.trim();
}
const statsKey = () => `${ui.statsDays}:${ui.project}`;

function loadStats() {
  const key = statsKey();
  if (ui.statsLoading === key) return;
  ui.statsLoading = key;
  ui.statsError = null;
  api("stats", { days: ui.statsDays, project_id: ui.project === "all" ? null : Number(ui.project) })
    // ответ на старый фильтр, пришедший после смены фильтра, не затирает свежий
    .then((data) => { if (!ui.stats || key === statsKey()) { ui.stats = { key, data }; ui.statsError = null; } })
    .catch((e) => { ui.statsError = { key, msg: e.message }; })
    .finally(() => { if (ui.statsLoading === key) ui.statsLoading = null; if (ui.tab === "stats") render(); });
}

function viewStats() {
  const key = statsKey();
  const failed = ui.statsError && ui.statsError.key === key;
  // новые цифры грузятся поверх старых (приглушённых), без мигания пустым экраном; после ошибки — только по «Повторить»
  if ((!ui.stats || ui.stats.key !== key) && !failed) loadStats();
  let html = `<div class="chips">${[7, 30, 90].map((d) => `<button class="chip ${ui.statsDays === d ? "on" : ""}" data-act="stats-days" data-d="${d}">${d} дней</button>`).join("")}${fullscreenChip()}</div>` + projectChips();
  if (failed) html += `<div class="banner"><span class="grow">Не обновилось · ${esc(ui.statsError.msg)}</span><button class="btn sm" data-act="stats-retry">Повторить</button></div>`;
  if (!ui.stats) return html + (failed ? "" : `<div class="loading">Считаю…</div>`);
  const d = ui.stats.data;
  html += `<div class="${ui.stats.key !== key ? "stale" : ""}">`;
  html += `<div class="muted" style="margin:0 4px 8px">${fmt(d.from)} – ${fmt(d.to)}</div>`;
  html += `<div class="stats-cols"><div>${statsTeam(d.team)}</div><div>${statsLangs(d)}${statsEpisodes(d)}</div></div>`;
  html += statsHealth(d);
  return html + `</div>`;
}

function statsTeam(t) {
  const closed = t.stages.reduce((n, x) => n + x.closed, 0);
  const onTime = t.stages.reduce((n, x) => n + x.onTime, 0);
  const tile = (v, l, cls = "") => `<div class="tile ${cls}"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  let html = `<h2>Команда</h2><div class="tiles">
    ${tile(t.released, "выпусков вышло")}
    ${tile(t.uploads, "выкладок на каналы")}
    ${tile(closed ? Math.round(onTime / closed * 100) + "%" : "—", closed ? `этапов в срок (${onTime} из ${closed})` : "этапов в срок")}
    ${tile(t.overdueNow ? "⚠️ " + t.overdueNow : "0", "просрочено сейчас", t.overdueNow ? "bad" : "")}</div>`;
  const phase = (st) => (t.phases.find((p) => p.stage === st) || {}).days;
  html += `<div class="card">${t.stages.map((x) => {
    const pct = x.closed ? Math.round(x.onTime / x.closed * 100) : 0;
    const dur = phase(x.stage);
    const meta = [x.closed ? `${x.onTime} из ${x.closed} в срок` : "за период не было", x.avgLate ? `опоздание ≈ ${x.avgLate} дн.` : "", dur != null ? `длится ≈ ${dur} дн.` : ""].filter(Boolean).join(" · ");
    return `<div class="st-row"><b>${META[x.stage].e} ${META[x.stage].n}</b><span class="num">${x.closed ? pct + "%" : ""}</span>
      <div class="muted" style="grid-column:1/-1">${meta}</div>${x.closed ? `<div class="bar" title="${pct}% в срок"><b style="width:${pct}%"></b></div>` : ""}</div>`;
  }).join("")}
    ${t.cycleDays != null ? `<div class="small" style="margin-top:8px">⏱ От готового сценария до выхода — в среднем <b>${t.cycleDays} дн.</b></div>` : ""}</div>`;
  if (t.members.length) {
    html += `<div class="card">${t.members.map((m) => `<div class="member"><div class="ava">${esc(m.name.slice(0, 1).toUpperCase())}</div>
      <div class="grow"><div>${esc(m.name)}</div><div class="muted">${m.closed ? `${m.closed} этап(ов) · ${m.late ? `${m.late} с опозданием` : "все в срок"}` : "за период ничего не закрыто"}</div></div>
      ${m.overdueNow ? `<span class="badge late">⚠️ ${m.overdueNow} просрочено</span>` : ""}</div>`).join("")}</div>`;
  }
  return html;
}

function statsLangs(d) {
  let html = `<h2>Языки</h2>`;
  if (!d.youtube.enabled) {
    return html + `<div class="card small">📈 Просмотры по языкам появятся, когда подключим ключ YouTube Data API: Google Cloud → включить <b>YouTube Data API v3</b> → создать API key → <code>YOUTUBE_API_KEY</code> в .env → деплой.</div>`;
  }
  if (!d.youtube.last_day) return html + `<div class="card muted small">Первый сбор цифр — завтра в 6 утра. Каналы со ссылкой на YouTube попадут в статистику сами.</div>`;
  const projects = S.projects.filter((p) => d.channels.some((c) => c.project_id === p.id && (c.subscribers != null || c.median != null)));
  if (!projects.length) {
    // ссылки есть, но канал подключили после утреннего сбора — цифр по нему ещё нет
    const linked = d.channels.some((c) => (chan(c.channel_id) || {}).youtube_url);
    return html + `<div class="card muted small">${linked
      ? "Цифр по каналам ещё нет — бот собирает их каждое утро в 6:00, новые каналы появятся после ближайшего сбора."
      : "У каналов нет ссылок на YouTube — добавь их в настройках проекта."}</div>`;
  }
  for (const p of projects) {
    const cs = d.channels.filter((c) => c.project_id === p.id).sort((a, b) => ((chan(a.channel_id) || {}).sort ?? 0) - ((chan(b.channel_id) || {}).sort ?? 0));
    const hasDelta = cs.some((c) => c.viewsDelta != null);
    // пока нет истории снимков — всего просмотров канала; потом — прирост за период
    const val = (c) => (hasDelta ? c.viewsDelta : c.totalViews);
    const max = Math.max(1, ...cs.map((c) => Math.max(0, val(c) || 0)));
    const span = Math.max(...cs.map((c) => c.deltaDays || 0));
    const caption = hasDelta
      ? `Прирост просмотров за ${span < d.days ? `${span} дн. — история копится` : `${d.days} дн.`}`
      : "Всего просмотров канала (прирост за период появится, когда накопится история)";
    const d7 = cs.some((c) => c.medianKind === "d7");
    const legend = `<div class="muted small" style="margin-top:6px">👥 подписчики${hasDelta ? " · всего — просмотров канала" : ""} · ролик — типичные просмотры одного ролика${d7 ? " за первые 7 дней" : ""} · новых — роликов за период</div>`;
    html += `<div class="card"><b>${esc(p.emoji)} ${esc(p.name)}</b><div class="muted small" style="margin-bottom:2px">${caption}</div>
      ${cs.map((c) => {
        const v = val(c);
        const w = v == null ? 0 : Math.max(0, v) / max * 100;
        // общее число — точно, как в YouTube; прирост — коротко
        const txt = v == null ? "—" : hasDelta ? signed(v) : v.toLocaleString("ru-RU");
        const sub = [`👥 ${c.subscribers == null ? "—" : c.subscribers.toLocaleString("ru-RU")}${c.subsDelta ? ` (${signed(c.subsDelta)})` : ""}`,
          hasDelta && c.totalViews != null ? `всего ${fmtNum(c.totalViews)}` : "",
          c.median != null ? `<span title="${c.medianKind === "d7" ? "медиана просмотров на 7-й день" : "медиана просмотров роликов старше недели"}">ролик ≈ ${fmtNum(c.median)}</span>` : "",
          c.videosInPeriod ? `новых: ${c.videosInPeriod}` : ""].filter(Boolean).join(" · ");
        const name = chName(c.channel_id, c.lang);
        return `<div class="bar-row" title="${esc(name)}: ${txt}">
          <span class="ellipsis">${esc(name)}</span><span class="num">${txt}</span>
          <div class="bar">${v == null ? "" : `<b style="width:${w}%"></b>`}</div></div>
          <div class="bar-sub muted small">${sub}</div>`;
      }).join("")}${legend}</div>`;
  }
  return html;
}

function statsEpisodes(d) {
  if (!d.episodes.length) return "";
  return `<h2>Выпуски на всех языках</h2><div class="card">${d.episodes.map((e) => {
    const p = proj(e.project_id) || { emoji: "" };

// ---------- шторка ----------
/** native — функция, которая возвращает кнопки внизу экрана Telegram для этой шторки: { main, second }. */
function openSheet(renderFn, native) {
  ui.sheet = { render: () => { document.getElementById("sheet").innerHTML = `<div class="grip"></div>` + renderFn(); }, native };
  ui.sheet.render();
  document.getElementById("sheet").classList.add("open");
  document.getElementById("sheet-bg").classList.add("open");
  document.getElementById("sheet").scrollTop = 0;
  if (tg && tg.BackButton) tg.BackButton.show();
  syncNative();
}
function closeSheet() {
  ui.sheet = null;
  document.getElementById("sheet").classList.remove("open");
  document.getElementById("sheet-bg").classList.remove("open");
  if (tg && tg.BackButton) tg.BackButton.hide();
  syncNative();
}

// ---------- кнопки внизу экрана Telegram (MainButton / SecondaryButton) ----------
let nativeNow = { main: null, second: null };
const hasMain = () => !!(tg && tg.MainButton && (tg.initData || FAKE_NATIVE));
// SecondaryButton есть в объекте WebApp и на старых клиентах, но Telegram < 7.10 его не рисует: тогда «📁 Папка» остаётся на странице
const hasSecond = () => !!(tg && tg.SecondaryButton && (tg.initData || FAKE_NATIVE) && tg.isVersionAtLeast && tg.isVersionAtLeast("7.10"));

function setNative(main, second) {
  nativeNow = { main: main || null, second: second || null };
  try {
    if (hasMain()) { if (main) tg.MainButton.setParams({ text: main.text, is_visible: true, is_active: true }); else tg.MainButton.hide(); }
    if (hasSecond()) { if (second) tg.SecondaryButton.setParams({ text: second.text, is_visible: true, position: "left" }); else tg.SecondaryButton.hide(); }
  } catch (_) {}
}

/** Какие кнопки нужны сейчас: у открытой шторки — свои, на «Сейчас» — для главной задачи. */
function syncNative() {
  if (!S) return;
  if (ui.sheet) {
    const n = ui.sheet.native ? ui.sheet.native() : null;
    return setNative(n && n.main, n && n.second);
  }
  const g = ui.tab === "my" ? ui.hero : null;
  if (!g) return setNative(null, null);
  const e = ep(g.eid);
  const single = g.info.total === 1 && !g.info.ts[0].channel_id;
  const ids = g.activeMine.map((t) => t.id);
  const main = ids.length && (single || ids.length > 1)
    ? { text: ids.length > 1 ? `✅ Все ${ids.length} готовы · ${epBtn(e)}` : `✅ ${META[g.stage].n} · ${epBtn(e)}`, run: () => markDone(ids) }
    : null;
  const second = e.drive_folder_id ? { text: "📁 Папка", run: () => openUrl(folderLink(e.drive_folder_id)) } : null;
  setNative(main || second, main ? second : null);
}

/** Для шторки выпуска: «готово» по моему открытому этапу и папка. */
function episodeNative(id) {
  return () => {
    const e = ep(id);
    if (!e) return null;
    const mine = epTasks(id).filter((t) => t.assignee_id === S.me.tg_id && isActive(t));
    const st = mine[0] && mine[0].stage;
    const ids = mine.filter((t) => t.stage === st).map((t) => t.id);
    const main = ids.length ? { text: ids.length > 1 ? `✅ Все ${ids.length} ${META[st].n.toLowerCase()} · ${epBtn(e)}` : `✅ ${META[st].n} · ${epBtn(e)}`, run: () => markDone(ids) } : null;
    const second = e.drive_folder_id ? { text: "📁 Папка", run: () => openUrl(folderLink(e.drive_folder_id)) } : null;
    return { main: main || second, second: main ? second : null };
  };
}

function openUrl(url) {
  if (tg && tg.openLink && tg.initData) tg.openLink(url);
  else window.open(url, "_blank");
}

function memberOptions(selected, emptyLabel = "— никто") {
  return `<option value="">${emptyLabel}</option>` + S.members.map((m) => `<option value="${m.tg_id}" ${m.tg_id === selected ? "selected" : ""}>${esc(m.name)}</option>`).join("");
}

/** «⚡ Сжатый график» под датой выхода: при создании и при переносе. */
function compressNote(p, date) {
  return isCompressedFor(p, date) ? `<div class="note warn">⚡ Сжатый график: сценарий нужен сегодня, остальные этапы идут подряд до выхода.</div>` : "";
}

      html += `<div class="stage-box"><div class="head"><b class="grow">${META[st].e} ${META[st].n}</b>

      <div class="card"><div class="row" style="gap:6px"><input class="inp grow" id="link-url"${kp("link-url")} placeholder="https://drive.google.com/…"></div>
      <div class="row" style="margin-top:6px;gap:6px"><input class="inp grow" id="link-title"${kp("link-title")} placeholder="Подпись (необязательно)">
      <select class="inp" id="link-stage"${kp("link-stage")} style="width:auto">${STAGES.map((s) => `<option value="${s}">${META[s].e} ${META[s].n}</option>`).join("")}<option value="">🔗 Другое</option></select></div>
      <button class="btn block" style="margin-top:8px" data-act="add-link" data-id="${id}">Добавить ссылку</button></div>

/** Подсказки формы нового выпуска: сжатый график, чужая папка, сроки. Обновляются на месте, без перерисовки полей. */
function newEpHints(st) {
  const p = proj(st.project_id) || S.projects[0];
  const compressed = st.compressed != null ? st.compressed : isCompressedFor(p, st.date);
  let html = "";
  if (compressed) html += `<div class="note warn">⚡ Сжатый график: сценарий нужен сегодня, остальные этапы идут подряд до выхода.</div>`;
  if (st.folder) {
    html += `<label class="note" style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="ne-usefolder" data-act-change="ne-usefolder"${kp("ne-usefolder")} ${st.useFolder ? "checked" : ""}>
      <span>Возьму папку «${esc(st.folder.name)}» с Диска — новая не создастся, номер ей не нужен.</span></label>`;
  }
  const folderNote = st.folder && st.useFolder ? "" : p.drive_folder_id ? `📁 На Диске появится папка «${esc(st.code || st.codeHint || "…")} ${esc(st.title || "Название")}» с подпапками 1_Сценарий, 2_Озвучка, 3_Готовое видео.<br>` : "";
  html += `<div class="muted small">${folderNote}Сроки — по настройкам проекта: сценарий за ${p.script_offset} дн. до выхода, ${esc(voiceHint(p))}, монтаж за ${p.edit_offset} дн.</div>`;
  return html;
}

const folderLink = (id) => `https://drive.google.com/drive/folders/${id}`;

function nextCode(pid) {
  let max = 0;
  for (const e of S.episodes.filter((x) => x.project_id === pid)) {
    const m = String(e.code).match(/(\d+)\s*$/);
    if (m) max = Math.max(max, +m[1]);
  }
  return "S" + String(max + 1).padStart(2, "0");
}

/** Форма хранит всё набранное в ui.newEp: ответ сервера и смена проекта её не затирают. */
async function openNewEpisode() {
  const pid = ui.project !== "all" ? Number(ui.project) : S.projects[0].id;
  const state = { project_id: pid, title: "", code: "", date: "", dateTouched: false, codeHint: nextCode(pid), folder: null, useFolder: true, compressed: null, seq: 0 };
  ui.newEp = state;
  openSheet(newEpisodeSheet(state), () => ({ main: { text: "Создать выпуск", run: () => handlers["create-episode"]() } }));
  await suggestDate(state);
}

/** Подсказка с сервера: дата, номер, ничейная папка, сжатый график. Своя дата и код пользователя не перетираются. */
async function suggestDate(state) {
  const seq = ++state.seq;
  const body = { project_id: state.project_id };
  if (state.title.trim()) body.title = state.title.trim();
  if (state.dateTouched && state.date) body.publish_date = state.date;
  let r;
  try { r = await api("episode.suggest", body); } catch (_) { return; }
  // ответ на устаревший запрос (проект сменили, ещё что-то набрали) игнорируется
  if (!ui.sheet || ui.newEp !== state || seq !== state.seq) return;
  if (!state.dateTouched && r.publish_date) state.date = r.publish_date;
  if (r.code) state.codeHint = state.serverCode = r.code; // номер с учётом папок на Диске
  state.folder = r.folder || null;
  state.compressed = r.compressed == null ? null : !!r.compressed;
  paintNewEpisode(state);
}

/** Обновить подсказки и плейсхолдеры формы на месте: поля и фокус не трогаем. */
function paintNewEpisode(st) {
  const set = (id, fn) => { const el = document.getElementById(id); if (el) fn(el); };
  set("ne-hints", (el) => { el.innerHTML = newEpHints(st); });
  set("ne-code", (el) => { el.placeholder = st.codeHint || "S01"; });
  set("ne-date", (el) => { if (!st.dateTouched) el.value = st.date || ""; });
}

function openProject(id) {
  const p = proj(id);
  const draft = p
    ? {
      ...p, roles: {},
      drive_folder: p.drive_folder_id ? `https://drive.google.com/drive/folders/${p.drive_folder_id}` : "",
      channels: projChannels(id).map((c) => ({ id: c.id, lang: c.lang, name: c.name || "", youtube_url: c.youtube_url || "" })),
    }
    : {
      id: 0, name: "", emoji: "🎬", cadence_days: 7, script_offset: 7, voice_offset: 5, edit_offset: 3, upload_offset: 0, voice_days: 0,
      drive_folder: "", roles: {}, channels: ["ru", "en", "de", "pl", "es"].map((lang) => ({ lang, name: "", youtube_url: "" })),
    };
  for (const s of STAGES) {
    const r = S.roles.find((x) => x.project_id === id && x.stage === s);
    // для нового проекта подставляем роли из первого существующего
    const fallback = S.roles.find((x) => x.stage === s);
    draft.roles[s] = r ? r.member_id : !p && fallback ? fallback.member_id : null;
  }
  draft.autoColor = p ? pcolor(p) : PALETTE[S.projects.length % PALETTE.length];
  ui.draft = draft;
  openSheet(projectSheet(draft), () => ({ main: { text: draft.id ? "Сохранить" : "Создать проект", run: () => handlers["save-project"]() } }));
  if (!p && S.drive && S.drive.enabled) {
    ui.driveFolders = null;
    api("drive.folders").then((r) => { ui.driveFolders = r.folders || []; if (ui.draft === draft) renderSheet(); })
      .catch(() => { ui.driveFolders = []; if (ui.draft === draft) renderSheet(); });
  }
}

function topicsSection(pid) {
  const gt = S.group_topics || [];
  const owner = (thread) => {
    const t = (S.topics || []).find((x) => Number(x.thread_id) === Number(thread));
    return t ? `${(proj(t.project_id) || { name: "?" }).name} · ${KINDS.find((k) => k.id === t.kind).n}` : null;
  };
  const missing = KINDS.filter((k) => !topicBound(pid, k.id)).length;
  return `<h2>Темы в группе</h2><div class="card">${KINDS.map((k) => {
    const cur = (S.topics || []).find((x) => x.project_id === pid && x.kind === k.id);
    return `<label class="f"><span>${k.e} ${k.n}</span><select class="inp" data-act-change="topic" data-pid="${pid}" data-kind="${k.id}">
      <option value="">— не привязана</option>
      ${gt.map((t) => {
        const o = owner(t.thread_id);
        const mine = cur && Number(cur.thread_id) === Number(t.thread_id);

function readProjectForm() {

  document.querySelectorAll("#sheet [data-pf]").forEach((el) => {
    if (el.type !== "number") d[el.dataset.pf] = el.value;
    else d[el.dataset.pf] = el.value === "" ? (el.dataset.pf === "voice_days" ? null : "") : Number(el.value);

  document.querySelectorAll("#sheet [data-ch]").forEach((el) => { d.channels[Number(el.dataset.ch)][el.dataset.k] = el.value.trim(); });

/** Текст подтверждения: «Удалить канал PL и N задач выкладки?» */
function delChannelText(chs) {
  const n = S.tasks.filter((t) => chs.some((c) => c.id === t.channel_id)).length;
  const names = chs.map((c) => langTag(c.lang)).join(", ");
  return `Удалить ${chs.length > 1 ? "каналы" : "канал"} ${names} и ${n} задач выкладки?`;
}
/** Проверка формы проекта до отправки: пустое «каждые N дней» не должно стать нулём. */
function projectFormError(d) {
  const int = (v, min) => typeof v === "number" && Number.isInteger(v) && v >= min;
  if (!int(d.cadence_days, 1)) return "Выпуск каждые N дней — целое число от 1";
  for (const s of STAGES) if (!int(d[s + "_offset"], 0)) return `${META[s].n}: за сколько дней до выхода — целое число от 0`;
  if (d.voice_days != null && !int(d.voice_days, 0)) return "Озвучка: дни после сценария — целое число от 0 или пусто";
  return "";
}
