  "toggle-onb": () => { store("onbCollapsed", store("onbCollapsed") === "1" ? "0" : "1"); render(); },
  "now-all": (el) => { ui.nowAll = el.dataset.v === "1"; render(); },
  "stats-retry": () => { ui.statsError = null; if (ui.stats) ui.stats.key = ""; render(); },
  "pick-color": (el) => { readProjectForm(); ui.draft.color = el.dataset.c; haptic("light"); ui.sheet.render(); },
  "close-sheet": () => closeSheet(),
  "new-episode": () => openNewEpisode(),
  "done": (el) => markDone(el.dataset.ids.split(",").map(Number), el),
  "toggle": async (el) => {
    const t = S.tasks.find((x) => x.id === Number(el.dataset.id));
    if (!t) return;
    if (t.done_at) {
      if (await confirmBox("Снять отметку «готово»?")) act("tasks.done", { ids: [t.id], done: false });
    } else if (!isActive(t)) {
      haptic("warning");
      toast("Сначала нужно закончить предыдущий этап");
    } else markDone([t.id], el);
  },
  "add-link": async (el) => {
    const url = document.getElementById("link-url").value.trim();
    if (!url) return toast("Вставь ссылку");
    await act("link.add", { episode_id: Number(el.dataset.id), url, title: document.getElementById("link-title").value.trim(), stage: document.getElementById("link-stage").value }, "🔗 Добавлено",
      { el, commit: ["link-url", "link-title"] });
  },
  "open-link": (el, ev) => { ev.preventDefault(); openUrl(el.href); },
  "del-link": async (el) => { if (await confirmBox("Удалить ссылку?")) act("link.delete", { id: Number(el.dataset.id) }, undefined, { el }); },
  "del-episode": async (el) => {
    if (await confirmBox("Удалить выпуск со всеми задачами? Посты в группе тоже удалятся. Пустую папку на Диске бот уберёт в корзину, папку с файлами — оставит.")) {
      const r = await act("episode.delete", { id: Number(el.dataset.id) }, undefined, { el });
      if (!r) return;
      toast(r.folder === "kept" ? "Удалено. Папка на Диске оставлена — в ней есть файлы" : r.folder === "trashed" ? "Удалено, пустая папка — в корзине Диска" : "Удалено");
      closeSheet();
    }
  },
  "create-episode": async (el) => {
    const st = ui.newEp;
    const title = document.getElementById("ne-title").value.trim();
    if (!title) return toast("Напиши название");
    // пустой код — шлём подсказанный сервером: повтор после таймаута упрётся в «Код занят», а не создаст второй выпуск.
    // Исключение: папку нашли, но не берём — подсказка посчитана в расчёте, что выпуск займёт её номер; сервер назначит код сам, учтя папку как занятую
    const skipHint = !!(st && st.folder && !st.useFolder);
    const body = {
      project_id: Number(document.getElementById("ne-project").value), title,
      code: document.getElementById("ne-code").value.trim() || (!skipHint && st && st.serverCode) || undefined,
      publish_date: document.getElementById("ne-date").value || undefined,
    };
    if (st && st.folder && st.useFolder) body.drive_folder_id = st.folder.id;
    const r = await act("episode.create", body, null, { el });
    if (!r) return;
    const e = ep(r.id);
    toast(e ? "🎬 Выпуск создан: " + epLabel(e) : "🎬 Выпуск создан");
    openSheet(episodeSheet(r.id), episodeNative(r.id));
  },
  "edit-project": (el) => openProject(Number(el.dataset.id)),
  "ch-add": () => { readProjectForm(); ui.draft.channels.push({ lang: "", name: "", youtube_url: "" }); ui.sheet.render(); },
  "ch-del": async (el) => {
    readProjectForm();
    const d = ui.draft, ch = d.channels[Number(el.dataset.i)];
    if (!ch) return;
    // удаление канала стирает его задачи выкладки во всех выпусках — без вопроса нельзя
    if (ch.id) {
      if (!(await confirmBox(delChannelText([ch])))) return;
      (d.confirmedDel = d.confirmedDel || new Set()).add(ch.id);
    }
    d.channels.splice(d.channels.indexOf(ch), 1);
    ui.sheet.render();
  },
  "save-project": async (el) => {
    readProjectForm();
    const d = ui.draft;
    if (!d.name.trim()) return toast("Нужно название");
    const bad = projectFormError(d);
    if (bad) return toast(bad);
    const channels = d.channels.filter((c) => c.lang).map((c) => ({ id: c.id, lang: c.lang, name: c.name || null, youtube_url: c.youtube_url || null }));
    // канал со стёртым названием языка тоже пропадёт — спрашиваем и про него
    const gone = projChannels(d.id).filter((c) => !channels.some((x) => x.id === c.id) && !(d.confirmedDel && d.confirmedDel.has(c.id)));
    if (gone.length && !(await confirmBox(delChannelText(gone)))) return;
    const { confirmedDel, autoColor, ...payload } = d;
    const r = await act("project.save", { ...payload, color: d.color || autoColor, channels }, d.id ? "Сохранено" : "Проект создан", { el });
    if (!r) return;
    if (!d.id && r.id) openProject(r.id); // сразу показать темы и каналы нового проекта
    else closeSheet();
  },
  "pick-folder": (el) => {
    readProjectForm();
    const d = ui.draft;
    d.drive_folder = `https://drive.google.com/drive/folders/${el.dataset.id}`;
    const nm = el.dataset.name.replace(/_/g, " ").replace(/\s+/g, " ").trim();
    d.name = nm.charAt(0).toUpperCase() + nm.slice(1);
    haptic("light");
    ui.sheet.render();
  },
  "topics-create": async (el) => {
    readProjectForm();
    await act("topics.create_missing", { project_id: Number(el.dataset.id) }, "Темы созданы в группе", { el });
  },
  "archive-project": async (el) => {
    if (await confirmBox("Архивировать проект? Его выпуски пропадут из списков и напоминаний.")) {
      if (await act("project.archive", { id: Number(el.dataset.id) }, "Проект в архиве", { el })) closeSheet();
    }
  },
  "save-settings": (el) => {
    const hour = (id) => { const v = document.getElementById(id).value.trim(); return /^[0-9]+$/.test(v) ? Number(v) : null; };
    const morning = hour("set-morning"), evening = hour("set-evening");
    if (morning == null || evening == null || morning > 23 || evening > 23) return toast("Час — число от 0 до 23");
    if (morning >= evening) return toast("Утро должно быть раньше вечера");
    return act("settings.save", { timezone: document.getElementById("set-tz").value.trim(), morning_hour: morning, evening_hour: evening }, "Сохранено", { el });
  },
  // своя шторка вместо window.prompt: prompt в Telegram на iOS и Android не показывается
  "rename": (el) => {
    const id = Number(el.dataset.id);
    openSheet(() => {
      const m = mem(id);
      if (!m) { closeSheet(); return ""; }
      return `<div class="sheet-title"><b>Имя в боте</b><button class="icon-btn" data-act="close-sheet">✕</button></div>
        <div class="card"><label class="f"><span>Как бот называет ${m.username ? "@" + esc(m.username) : "участника"} в постах и напоминаниях</span>
        <input class="inp" id="rn-name" value="${esc(m.name)}" maxlength="40" enterkeyhint="done"></label></div>
        <button class="btn block dup-main" data-act="rename-save" data-id="${id}">Сохранить</button>`;
    }, () => ({ main: { text: "Сохранить", run: () => handlers["rename-save"]({ dataset: { id } }) } }));
  },
  "rename-save": async (el) => {
    const name = document.getElementById("rn-name").value.trim();
    if (!name) return toast("Имя не может быть пустым");
    if (await act("member.update", { tg_id: Number(el.dataset.id), name }, "Сохранено", { el })) closeSheet();
  },
};

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el || el.tagName === "SELECT") return;
  const h = handlers[el.dataset.act];
  if (!h) return;
  // асинхронный обработчик (подтверждение → запрос) не запускается второй раз, пока не закончил первый
  if (el.dataset.pending) return;
  const r = h(el, ev);
  if (r && r.then) { el.dataset.pending = "1"; const clear = () => { delete el.dataset.pending; }; r.then(clear, clear); }
});

// ПК: Esc закрывает шторку, Enter в поле имени — сохраняет
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && ui.sheet) closeSheet();
  if (ev.key === "Enter" && ev.target.id === "rn-name") document.querySelector("#sheet [data-act='rename-save']").click();
});

// Набранное в форме нового выпуска сразу уходит в ui.newEp: перерисовка и ответы сервера его не трогают
document.addEventListener("input", (ev) => {
  const el = ev.target, st = ui.newEp;
  if (ui.sheet && st && el.id && el.id.startsWith("ne-")) {
    if (el.id === "ne-title") { st.title = el.value; paintNewEpisode(st); suggestSoon(st); }
    if (el.id === "ne-code") { st.code = el.value; paintNewEpisode(st); }
    if (el.id === "ne-date") { st.date = el.value; st.dateTouched = true; st.compressed = null; paintNewEpisode(st); suggestSoon(st); }
  }
  // перенос даты у существующего выпуска: предупреждение о сжатом графике сразу, до сохранения
  if (ui.sheet && el.dataset && el.dataset.field === "publish_date") {
    const e = ep(sheetEpisodeId()), box = document.getElementById("ep-compress");
    if (e && box) box.innerHTML = compressNote(proj(e.project_id), el.value);
  }
});

const sheetEpisodeId = () => { const b = document.querySelector("#sheet [data-act='del-episode']"); return b ? Number(b.dataset.id) : 0; };
const FIELD_KEYS = { title: "f-title", code: "f-code", publish_date: "f-date", notes: "f-notes" };

document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.dataset.actChange === "ne-usefolder") { if (ui.newEp) { ui.newEp.useFolder = el.checked; paintNewEpisode(ui.newEp); } return; }
  if (el.dataset.actChange === "ne-project") {
    const pid = Number(el.value);
    const st = ui.newEp;
    st.project_id = pid;
    st.codeHint = nextCode(pid);
    st.serverCode = null; // номер другого проекта не годится — ждём новую подсказку
    st.folder = null; st.compressed = null; st.useFolder = true;
    renderSheet(); // название, код и дата живут в ui.newEp — смена проекта их не сбрасывает
    suggestDate(st);
    return;
  }
  if (el.dataset.actChange === "topic") {
    readProjectForm();
    const v = el.value;
    act("topics.set", { project_id: Number(el.dataset.pid), kind: el.dataset.kind, thread_id: v === "new" ? "new" : v ? Number(v) : null },
      v === "new" ? "Тема создана в группе" : v ? "Тема привязана" : "Тема отвязана");
    return;
  }
  if (el.dataset.actChange === "assign") {
    if (el.value === "разные") return;
    act("tasks.assign", { ids: el.dataset.ids.split(",").map(Number), assignee_id: el.value ? Number(el.value) : null }, "Назначено");
    return;
  }
  if (el.dataset.actChange === "due") {
    if (!el.dataset.ids) return;
    act("tasks.assign", { ids: el.dataset.ids.split(",").map(Number), due_date: el.value || null }, "Срок изменён");
    return;
  }
  if (el.dataset.field && ui.sheet) {
    const id = sheetEpisodeId();
    if (!id) return;
    // после сохранения поле показывает то, что записал сервер (он может поправить код), а не набранное
    act("episode.update", { id, [el.dataset.field]: el.value }, "Сохранено", { commit: [FIELD_KEYS[el.dataset.field]] });
  }
});

// ---------- старт ----------
async function start() {
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.initData) document.documentElement.classList.add("tg");
    // вне Telegram библиотека всегда отвечает «light» — тогда тема идёт по prefers-color-scheme
    const applyScheme = () => { if (tg.initData && tg.colorScheme) document.documentElement.dataset.scheme = tg.colorScheme; };
    applyScheme();
    if (tg.onEvent) tg.onEvent("themeChanged", applyScheme);
    if (tg.BackButton) tg.BackButton.onClick(closeSheet);
    // кнопки внизу экрана Telegram: один обработчик, действие — по текущему экрану
    if (hasMain()) { tg.MainButton.onClick(() => { haptic("light"); nativeNow.main && nativeNow.main.run(); }); document.documentElement.classList.add("has-main"); }
    if (hasSecond()) { tg.SecondaryButton.onClick(() => nativeNow.second && nativeNow.second.run()); document.documentElement.classList.add("has-second"); }
    // ⚙️ в меню Mini App открывает настройки
    if (tg.SettingsButton && tg.initData) { try { tg.SettingsButton.show(); tg.SettingsButton.onClick(() => { closeSheet(); ui.tab = "settings"; store("tab", "settings"); render(); }); } catch (_) {} }
    const since = (v) => tg.isVersionAtLeast && tg.isVersionAtLeast(v);
    try {
      // iOS/Android: свайп вниз по списку не должен сворачивать приложение
      if (since("7.7")) tg.disableVerticalSwipes();
      // шапка и низ окна Telegram — в цвет фона приложения, без белых полос
      if (since("6.1")) { tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("secondary_bg_color"); }
      if (since("7.10")) tg.setBottomBarColor("secondary_bg_color");
      if (canFullscreen()) {
        tg.onEvent("fullscreenChanged", () => { if (S) render(); });
        tg.onEvent("fullscreenFailed", (e) => toast(e && e.error === "UNSUPPORTED" ? "Этот Telegram не умеет полноэкранный режим" : "Не получилось развернуть окно"));
        if (store("fullscreen") === "1" && !tg.isFullscreen) tg.requestFullscreen();
      }
    } catch (_) {}
  }
  try {
    await load();
  } catch (e) {
    document.getElementById("view").innerHTML = `<div class="empty">😕 ${esc(e.message)}<br><br><button class="btn" onclick="location.reload()">Повторить</button></div>`;
    return;
  }
  const sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || qs.get("startapp") || "";
  const m = sp.match(/^ep_(\d+)$/);
  if (m && ep(Number(m[1]))) openSheet(episodeSheet(Number(m[1])), episodeNative(Number(m[1])));
}

if (FAKE_NATIVE) {
  // макет нижней панели Telegram: Main справа, Secondary слева
  const bar = document.createElement("div");
  bar.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:8px;padding:8px 12px 14px;background:var(--bg2);border-top:1px solid var(--sep)";
  document.body.appendChild(bar);
  document.body.style.paddingBottom = "140px";
  document.querySelector("nav").style.bottom = "64px";
  const mk = (id) => {
    const b = document.createElement("button");
    b.id = id; b.className = "btn"; b.style.cssText = "flex:1;display:none;padding:13px"; bar.appendChild(b);
    let cb = null, params = {}, progress = false;
    return {
      setParams(p) { Object.assign(params, p); b.textContent = params.text || ""; b.style.display = params.is_visible ? "block" : "none"; if (id === "fake-second") b.classList.add("ghost"); b.disabled = !!progress; },
      hide() { params.is_visible = false; b.style.display = "none"; },
      // как у настоящей кнопки: во время запроса — индикатор и нажатия не проходят
      showProgress() { progress = true; b.disabled = true; b.dataset.progress = "1"; },
      hideProgress() { progress = false; b.disabled = false; delete b.dataset.progress; },
      onClick(fn) { cb = fn; b.onclick = () => cb && cb(); },
    };
  };
  const second = mk("fake-second"), main = mk("fake-main");
  // у настоящего Telegram.WebApp эти свойства только для чтения — объявляем свои поверх
  const fake = Object.create(tg || {});
  // &tgver=7.0 — клиент старше 7.10: SecondaryButton не рисуется, «📁 Папка» должна остаться на странице
  const noop = () => {};
  for (const [k, v] of Object.entries({
    MainButton: main, SecondaryButton: second, initData: "", isVersionAtLeast: (v) => FAKE_VER >= Number(v),
    disableVerticalSwipes: noop, setHeaderColor: noop, setBackgroundColor: noop, setBottomBarColor: noop, ready: noop, expand: noop, onEvent: noop,
  })) {
    Object.defineProperty(fake, k, { value: v });
  }
  tg = fake;
}

if (MOCK) {
  const s = document.createElement("script");
  s.src = "mock.js";
  s.onload = start;
  document.head.appendChild(s);
} else start();
</script>
